<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example Website</title>

    <link rel="stylesheet" href="Styles/style.css">
</head>

<body>
    <header> <!--navigation --->
        <h2>Example Website</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#links">Links</a>
        </nav>
    </header>

    <main id="home">
        <section class="intro">
            <div class="intro-text"> <!--left side -->
                <h1>Welcome to my<br>Example Website</h1>
                <p>
                    This is a very simple website about nothing.
                </p>
                <a class="button" href="https://github.com/bonjerp">MY GITHUB</a>
            </div>
            <div class="image-placeholder"><img src="Assets/bongocat.gif" alt="Bongo Cat"></div> <!-- Right side -->
        </section>

        <section id="about" class="section">
            <h2>About</h2>
            <p> This is an example website made using HTML and CSS. There isn't really much going on here.</p>
        </section>

            <!-- Links -->
            <section id="links" class="section">
            <h2>Links</h2>
            <div class="links">
                <a href="https://github.com/bonjerp" target="_blank"><img src="Assets/github.ico" alt="GitHub Icon">GitHub</a>
                <a href="https://bonjerp.itch.io/" target="_blank"><img src="Assets/itch.io.ico" alt="itch.io Icon">itch.io</a>
            </div>
            </section>

    </main>

    <footer>
        <p>Example Website</p>
    </footer>

</body>
</html>
